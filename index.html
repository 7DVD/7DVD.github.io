<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>7DVD Website</title>
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;

      background-image: url("Picture 22.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;

      color: white;
      line-height: 1.6;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    nav a:hover {
      color: #007bff;
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 50px auto;
      padding: 20px;
      text-align: center;

      flex: 1;
    }

    .hero {
      background: rgba(0, 0, 0, 0.65);
      padding: 50px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .hero h1 {
      margin-bottom: 15px;
      font-size: 2.5rem;
    }

    .hero p {
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }

    .button:hover {
      background: #0056b3;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h2>7DVD Website</h2>

    <nav>
      <a href="index.html">Home</a>
      <a href="AboutMe.html">About</a>
      <a href="ContactMe.html">Contact</a>
    </nav>
  </header>

  
  <main>
    <section class="hero">
      <h1>Welcome to the main page</h1>
      <a href="GetStarted.html" class="button">Get Started</a>
    </section>
  </main>
  
  <footer>
    <p>&copy; 2026 7DVD Website. All rights reserved.</p>
  </footer>

</body>

</html>
